<!doctype html><html><head><meta charset="utf-8"><title>TBC Assistant</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 280px; background: #0F1422; color: #E8ECF6; font: 500 13px/1.45 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .top img { width: 32px; height: 32px; }
  .t { font-weight: 800; font-size: 14px; }
  .v { color: #8E97B0; font-size: 12px; }
  .sec { padding: 12px 16px; display: grid; gap: 8px; }
  .state { display: flex; align-items: center; gap: 8px; color: #B9C1D6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3B4257; flex: none; }
  .on .dot { background: #34D399; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: left; border: 0; border-radius: 10px; padding: 9px 12px; background: #1A2133; color: #E8ECF6; font: 700 12.5px inherit; font-family: inherit; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { background: #222B42; }
  button.pri { background: #5B83FF; color: #fff; }
  .muted { color: #8E97B0; font-size: 12px; }
  .foot { padding: 0 16px 14px; }
</style></head>
<body>
  <div class="top"><img src="icons/icon48.png" alt=""><div><div class="t" id="name">TBC Assistant</div><div class="v" id="ver"></div></div></div>
  <div class="sec">
    <div class="state" id="state"><span class="dot"></span><span id="stateText">Checking this page…</span></div>
    <div id="menu"></div>
  </div>
  <div class="foot"><a class="btn" id="guide" target="_blank">Install &amp; update guide</a></div>
  <script src="config.js"></script><script src="popup.js"></script>
</body></html>
